name: Security Scheduled Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up uv 0.12.0 and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Agent dependencies from root lock
        run: uv sync --locked --package agent
      - name: Run SAST scan
        run: node scripts/security/run-sast.mjs --sarif artifacts/security/sast.sarif
      - name: Upload security artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8edd # v4.6.1
        with:
          name: security-sast-artifacts
          path: artifacts/security/
          if-no-files-found: ignore

  security-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Use LF checkout behavior
        run: git config --global core.autocrlf input
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up uv 0.12.0 and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.0
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Agent dependencies from root lock
        run: uv sync --locked --package agent
      - name: Run supply chain scan
        run: node scripts/security/run-supply-chain.mjs --strict
      - name: Upload security artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8edd # v4.6.1
        with:
          name: security-supply-chain-artifacts
          path: artifacts/security/
          if-no-files-found: ignore

rules:
  - id: no-generic-eval-exec
    languages:
      - python
    severity: ERROR
    message: 'Dangerous code execution via eval or exec is forbidden across the codebase.'
    metadata:
      category: security
      subcategory: code-injection
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: no-dangerous-inner-html
    languages:
      - typescript
    severity: ERROR
    message: 'dangerouslySetInnerHTML is forbidden in web components without explicit reviewed exceptions.'
    metadata:
      category: security
      subcategory: xss
    pattern: 'dangerouslySetInnerHTML={{ __html: ... }}'

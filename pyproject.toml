[tool.uv.workspace]
members = ["apps/agent"]

[dependency-groups]
dev = [
    "ruff==0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "redis_integration: requires a reachable Redis server",
    "security: security regression and guardrail verification tests",
]
